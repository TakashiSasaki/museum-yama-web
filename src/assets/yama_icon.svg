<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- ベースの球体グラデーションのみ保持 -->
    <radialGradient id="sphereBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="80%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </radialGradient>

    <!-- クリップ用パス (半径を42から50へ拡大し境界にフィット) -->
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
  </defs>

  <!-- 球体ベース (半径を42から50へ拡大し境界にフィット) -->
  <circle cx="50" cy="50" r="50" fill="url(#sphereBg)" />

  <!-- 山並み・波のグラフィック本体 (中心50,50基準で1.19倍にスケールすることで余白を排除) -->
  <g clip-path="url(#circleClip)" stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(50, 50) scale(1.19) translate(-50, -50)">
    <path d="M -10 60 Q 25 40 50 55 T 110 40" stroke-width="1.5" opacity="0.4"/>
    <path d="M -10 80 Q 40 50 70 70 T 110 50" stroke-width="2.5" opacity="0.7"/>
    <path d="M 10 100 L 50 25 L 65 60 L 85 50 L 105 95" stroke-width="4.5"/>
    <path d="M 50 25 L 50 50" stroke-width="3" opacity="0.8"/>
    <path d="M -10 80 Q 50 88 110 80 L 110 120 L -10 120 Z" stroke-width="3" opacity="0.9" fill="#FFFFFF" fill-opacity="0.15"/>
  </g>
</svg>